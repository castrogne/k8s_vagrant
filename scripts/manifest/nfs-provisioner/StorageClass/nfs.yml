---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs
allowVolumeExpansion: true
mountOptions:
- noatime
- hard
- rsize=1048576
- wsize=1048576
- timeo=600
- retrans=2
- _netdev
- nofail
parameters:
  archiveOnDelete: "false"
  pathPattern: "${.PVC.namespace}-${.PVC.name}"
provisioner: nfs
reclaimPolicy: Delete
volumeBindingMode: Immediate
