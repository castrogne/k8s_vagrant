# Docs
## https://github.com/apache/apisix-helm-chart
## https://apisix.apache.org/docs/helm-chart/apisix/

# WAF Activation (Coraza)
# ======================
# APISIX includes Coraza WAF built-in (no external installation needed)
# Requires: APISIX 3.6+ (helm chart 2.13.0 includes APISIX 3.15.0)
# Plugin: wasm-coraza (via ApisixPluginConfig CRD)
# Documentation: Workshop Section 13

# ML-based WAF (open-appsec)
# ==========================
# Alternative: open-appsec for ML-based protection
# Download: https://downloads.openappsec.io/packages/helm-charts/apisix/
# Documentation: Workshop Section 14
# Note: This REPLACES standard APISIX deployment

# Init
## helm repo add apisix https://apache.github.io/apisix-helm-chart
## helm repo update
## kubectl create ns kube-gateway

# Deploy or Upgrade
## helm -n kube-gateway upgrade --install apisix apisix/apisix --version 2.13.0 -f helm/apisix/gateway-apisix.yml

# NOTE: Modify <CREDENTIAL_ADMIN> and <CREDENTIAL_VIEWER> with your actual credentials before running helm upgrade

etcd:
  persistence:
    enabled: false

#  persistence:
#    enabled: true
#    storageClass: local-path
#    size: 10Gi

service:
  http:
    servicePort: 80
    nodePort: 30080
  tls:
    servicePort: 443
    nodePort: 30443

apisix:
  ssl:
    enabled: true
  admin:
    allow:
      ipList:
        - 127.0.0.1/24
        - 192.168.0.0/16
    credentials:
      admin: <CREDENTIAL_ADMIN>
      viewer: <CREDENTIAL_VIEWER>
