## Show pod with labelSelector=app=nginx in namespace "whoami"
# kubectl get --raw "/apis/custom.metrics.k8s.io/v1beta1/namespaces/whoami/pod/*/nginx_http_requests_total?labelSelector=app=nginx" | jq

## Show kubernetes native Pods metrics available in namespace "whoami"
# kubectl get --raw "/apis/metrics.k8s.io/v1beta1/namespaces/whoami/pods" |jq

## Note: expressed in milli-requests-rate